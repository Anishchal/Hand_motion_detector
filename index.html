<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Hand Motion Tracking</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0f172a;
      color: #f8fafc;
    }

    h1 {
      margin-bottom: 8px;
    }

    #status {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #38bdf8;
      font-weight: 600;
    }

    .container {
      position: relative;
      width: 640px;
      height: 480px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Flip horizontally so it behaves like a mirror */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    canvas {
      pointer-events: none;
    }

    button {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background-color: #0284c7;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>Hand Motion Tracker</h1>
  <div id="status">Loading MediaPipe model...</div>

  <div class="container">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <button id="webcamButton" disabled>Enable Camera</button>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");
    const webcamButton = document.getElementById("webcamButton");

    let handLandmarker = null;
    let runningMode = "VIDEO";
    let lastVideoTime = -1;
    let prevWristPosition = null;

    // Movement threshold to ignore micro-jitters
    const MOVEMENT_THRESHOLD = 0.02;

    async function initHandLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: runningMode,
        numHands: 1
      });

      statusText.innerText = "Model loaded. Click 'Enable Camera' to begin.";
      webcamButton.disabled = false;
    }

    initHandLandmarker();

    webcamButton.addEventListener("click", async () => {
      if (!handLandmarker) return;

      const constraints = {
        video: { width: 640, height: 480 }
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.addEventListener("loadeddata", predictWebcam);
        webcamButton.style.display = "none";
        statusText.innerText = "Wave your hand in front of the camera!";
      } catch (err) {
        console.error("Camera access denied:", err);
        statusText.innerText = "Error: Webcam access denied or unavailable.";
      }
    });

    async function predictWebcam() {
      // Run detection when new frame is available
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.landmarks && results.landmarks.length > 0) {
          const landmarks = results.landmarks[0];
          const drawingUtils = new DrawingUtils(ctx);

          // Draw skeleton lines and points
          drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, {
            color: "#38bdf8",
            lineWidth: 3
          });
          drawingUtils.drawLandmarks(landmarks, {
            color: "#f43f5e",
            lineWidth: 1,
            radius: 4
          });

          // Track motion using the wrist landmark (index 0)
          const wrist = landmarks[0];

          if (prevWristPosition) {
            // Video and canvas are horizontally mirrored with CSS scaleX(-1)
            const dx = wrist.x - prevWristPosition.x;
            const dy = wrist.y - prevWristPosition.y;

            let horizontal = "";
            let vertical = "";

            if (Math.abs(dx) > MOVEMENT_THRESHOLD) {
              horizontal = dx > 0 ? "Right" : "Left";
            }
            if (Math.abs(dy) > MOVEMENT_THRESHOLD) {
              vertical = dy > 0 ? "Down" : "Up";
            }

            if (horizontal || vertical) {
              statusText.innerText = `Motion Detected: ${[horizontal, vertical].filter(Boolean).join(" + ")}`;
            } else {
              statusText.innerText = "Hand detected: Holding steady";
            }
          }

          prevWristPosition = { x: wrist.x, y: wrist.y };
        } else {
          prevWristPosition = null;
          statusText.innerText = "No hand detected";
        }
      }

      window.requestAnimationFrame(predictWebcam);
    }
  </script>
</body>
</html>
